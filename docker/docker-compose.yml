services:
  backend:
    build: 
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: beplan_server_container
    # Development: auto-reload on files synced by `docker compose watch`.
    command: ["sh", "-c", "uvicorn main:app --host 0.0.0.0 --port $${BACKEND_PORT} --reload"]
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    develop:
      watch:
        - action: sync
          path: ../apps/backend
          target: /app
          ignore:
            - ../apps/backend/__pycache__/
        - action: rebuild
          path: ../apps/backend/requirements.txt
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['BACKEND_PORT'] + '/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          # One worker with the NER model loaded idles at ~950 MiB; 1G left no headroom.
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    volumes:
      - backend_data:/app/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  backend_data:
